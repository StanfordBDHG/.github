name: Swift Test

on:
  workflow_call:
    inputs:
      path:
        description: |
          The path where the project is located. Defaults to $GITHUB_WORKSPACE.
        required: false
        type: string
        default: '.'
      runs_on_labels:
        description: |
          JSON-based collection of labels indicating which type of github runner should be chosen.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      swift_version:
        description: |
          Specify the Swift language version when using xcodebuild.
        required: false
        type: string
        default: ''
      environment:
        description: |
          GitHub deployment environment to optionally adjust access to variables and secrets with additional protection rules.
          https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment
        required: false
        type: string
        default: ''
      checkout_submodules:
        description: |
          Flag indicating if submodules should be automatically checked out.
        required: false
        type: boolean
      checkout_lfs:
        description: |
          Flag indicating if git lfs should be used when running the check out step.
        required: false
        type: boolean
        default: false
      artifact_name:
        description: |
          The name of the artifact that should be uploaded at the end of the build.
        required: false
        type: string
      build_configuration:
        description: |
            The build configuration parameter that should be passed to xcodebuild.
            Either use `Debug` or `Release` to build in the respective modes.
            If not defined, the `Debug` configuration is used.
        required: false
        type: string
        default: Debug
      test_flags:
        description: |
          Additional flags to pass to `swift test` (e.g. --no-parallel, --filter, --skip).
        required: false
        type: string
        default: ''
      job_name:
        description: |
          The name of the job as it appears in the GitHub Actions UI.
        required: false
        type: string
        default: 'Swift Test'
    secrets:
      CHECKOUT_TOKEN:
        description: |
          The Personal access token (PAT) to use with the checkout action.
        required: false
jobs:
  swift_test:
    name: ${{ inputs.job_name }}
    runs-on: ${{ fromJson(inputs.runs_on_labels) }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This is GitHubs way of implementing ternary expressions (see https://docs.github.com/en/actions/learn-github-actions/expressions)
          token: ${{ secrets.CHECKOUT_TOKEN != '' && secrets.CHECKOUT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout_submodules }}
          lfs: ${{ inputs.checkout_lfs }}
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ inputs.swift_version || 'latest' }}
      - name: Build Package
        run: |
          swift build \
            --configuration $(echo -n ${{ inputs.build_configuration }} | awk '{print tolower($0)}')
      - name: Run Tests
        run: |
          swift test \
            --enable-code-coverage \
            --configuration $(echo -n ${{ inputs.build_configuration }} | awk '{print tolower($0)}') \
            ${{ inputs.test_flags }}
      - name: Generate Coverage Report
        if: ${{ (success() || failure()) && inputs.artifact_name != '' }}
        shell: bash
        run: |
          CONFIG=$(echo -n ${{ inputs.build_configuration }} | awk '{print tolower($0)}')
          # Ask SwiftPM for the paths instead of assuming a build directory layout, which changed with Swift 6.4.
          COVERAGE_FILE="$(dirname "$(swift test --configuration "$CONFIG" --show-codecov-path)")/default.profdata"
          BIN_PATH=$(swift build --configuration "$CONFIG" --show-bin-path)
          # Swift 6.3 and earlier build a single `<Package>PackageTests.xctest` executable.
          # Swift 6.4 and later build one `<TestTarget>.so` per test target, each launched by a `<TestTarget>-test-runner`.
          TEST_BINARIES=()
          for FILE in "$BIN_PATH"/*.xctest "$BIN_PATH"/*-test-runner; do
            if [[ "$FILE" == *.xctest && -f "$FILE" ]]; then
              TEST_BINARIES+=("$FILE")
            elif [[ "$FILE" == *-test-runner && -f "${FILE%-test-runner}.so" ]]; then
              TEST_BINARIES+=("${FILE%-test-runner}.so")
            fi
          done
          if [[ ! -f "$COVERAGE_FILE" || ${#TEST_BINARIES[@]} -eq 0 ]]; then
            echo "::error::Unable to locate the coverage data ('$COVERAGE_FILE') or any test binaries in '$BIN_PATH'."
            exit 1
          fi
          OBJECT_ARGS=()
          for FILE in "${TEST_BINARIES[@]:1}"; do
            OBJECT_ARGS+=("-object=$FILE")
          done
          llvm-cov export \
            "${TEST_BINARIES[0]}" \
            "${OBJECT_ARGS[@]}" \
            --instr-profile="$COVERAGE_FILE" \
            --format=lcov > tmp.lcov
      - name: Convert LCOV format
        if: ${{ (success() || failure()) && inputs.artifact_name != '' }}
        shell: bash
        run: |
          python3 -c "
          import re, sys
          with open('tmp.lcov', 'r') as f:
              content = f.read()
          records = re.split(r'(?=^SF:)', content, flags=re.MULTILINE)
          result = []
          for record in records:
              if not record.strip() or not record.startswith('SF:'):
                  continue
              lines = record.strip().split('\n')
              sf_line = lines[0]
              fn_map = {}
              fnda_map = {}
              for line in lines[1:]:
                  if line.startswith('FN:'):
                      parts = line[3:].split(',', 1)
                      if len(parts) == 2:
                          fn_map[parts[1]] = parts[0]
                  elif line.startswith('FNDA:'):
                      parts = line[5:].split(',', 1)
                      if len(parts) == 2:
                          fnda_map[parts[1]] = parts[0]
              result.append(sf_line)
              for func_id, line_num in fn_map.items():
                  if func_id in fnda_map:
                      result.append(f'DA:{line_num},{fnda_map[func_id]}')
              result.append('end_of_record')
          with open('${{ inputs.artifact_name }}', 'w') as f:
              f.write('\n'.join(result))
          "
      - name: Upload artifact
        if: ${{ (success() || failure()) && inputs.artifact_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.path }}/${{ inputs.artifact_name }}
