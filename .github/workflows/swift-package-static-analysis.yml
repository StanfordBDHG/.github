name: Static Analysis

on:
  workflow_call:
    inputs:
      library_products:
        type: string
        required: true
      platform_name:
        type: string
        required: true
      platform_version:
        type: string
        default: ""
      # Deprecated: the API breaking-changes check has been removed from this workflow. This input is
      # retained so existing callers that set it (e.g. `diagnose_breaking_changes: false`) do not fail,
      # but it no longer has any effect.
      diagnose_breaking_changes:
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  reuse_action:
    name: REUSE Compliance Check
    uses: StanfordBDHG/.github/.github/workflows/reuse.yml@v2
  swiftlint:
    name: SwiftLint
    uses: StanfordBDHG/.github/.github/workflows/swiftlint.yml@v2
  markdown_link_check:
    name: Markdown Link Check
    uses: StanfordBDHG/.github/.github/workflows/markdown-link-check.yml@v2
