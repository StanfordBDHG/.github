name: Create and upload coverage report

on:
  workflow_call:
    inputs:
      coveragereports:
        description: |
          A string containing all names of the .xcresult files that are downloaded from the artifacts of previous jobs.
          Multiple values are separated by a space character.
        required: false
        type: string
      coveragereports_lcov:
        description: |
          A string containing all names of the .lcov files that are downloaded from the artifacts of previous jobs.
          Multiple values are separated by a space character.
          For proper coverage merging with .xcresult files, lcov files must contain only function coverage data.
        required: false
        type: string
    secrets:
      token:
        description: 'The CodeCov token used for private repositories'
        required: false

jobs:
  create-and-upload-coverage-report:
    name: Create and upload coverage report
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.0.1
      - name: Check environment
        run: |
            xcodebuild -version
            swift --version
      - uses: actions/download-artifact@v4
      - name: Install lcov
        if: ${{ inputs.coveragereports_lcov != '' }}
        run: |
          if ! command -v lcov &> /dev/null; then
            echo "Installing lcov..."
            brew install lcov
          fi
      - name: Merge lcov coverage reports
        if: ${{ inputs.coveragereports_lcov != '' && inputs.coveragereports == '' }}
        run: |
          FILES=( ${{ inputs.coveragereports_lcov }} )
          args=()
          for file in "${FILES[@]}"; do
            # each x.lcov artifact gets downloaded to `x.lcov/x.lcov` (ie, into a folder with the same name);
            # we need to take this into account when constructing the paths.
            args+=(-a "$file/$(basename "$file")")
          done
          lcov "${args[@]}" -o info.lcov --ignore-errors empty
      - name: Merge xcresult coverage reports
        if: ${{ inputs.coveragereports != '' }}
        shell: bash
        run: |
            FILES=( ${{ inputs.coveragereports }} )
            # Some result bundles contain no readable coverage data, e.g., UI test runs on Xcode 27 that recorded no coverage.
            # A single such bundle makes `xccov` fail on the merged result, so we skip these bundles with a warning instead.
            REPORTS=()
            for FILE in "${FILES[@]}"; do
              if xcrun xccov view --report --json "$FILE" > /dev/null 2>&1; then
                REPORTS+=("$FILE")
              else
                echo "::warning::Skipping '$FILE' as it does not contain readable code coverage data."
              fi
            done
            if [ ${#REPORTS[@]} -eq 0 ]; then
              echo "::error::None of the result bundles (${{ inputs.coveragereports }}) contain readable code coverage data."
              exit 1
            elif [ ${#REPORTS[@]} -gt 1 ]; then
              xcrun xcresulttool merge "${REPORTS[@]}" --output-path CodeCoverage.xcresult
            else
              mv "${REPORTS[0]}" CodeCoverage.xcresult
            fi
            rm -rf "${FILES[@]}"
      - uses: stanfordbdhg/xccov2lcov@v1
        if: ${{ inputs.coveragereports != '' }}
        with:
          xcresult: CodeCoverage.xcresult
      - name: Merge xcresult & lcov
        if: ${{ inputs.coveragereports_lcov != '' && inputs.coveragereports != '' }}
        run: |
          FILES=( ${{ inputs.coveragereports_lcov }} )
          args=()
          for file in "${FILES[@]}"; do
            # each x.lcov artifact gets downloaded to `x.lcov/x.lcov` (ie, into a folder with the same name);
            # we need to take this into account when constructing the paths.
            args+=(-a "$file/$(basename "$file")")
          done
          lcov -a info.lcov "${args[@]}" -o coverage_combined.lcov --ignore-errors empty
          mv coverage_combined.lcov info.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: info.lcov
          token: ${{ secrets.token }}
